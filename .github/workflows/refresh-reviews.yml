name: Refresh reviews
on:
  schedule: [{ cron: '30 1 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python tools/fetch_reviews.py
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          TRIPADVISOR_API_KEY: ${{ secrets.TRIPADVISOR_API_KEY }}
      - run: python tools/build_site.py
      - run: |
          git config user.name "reviews-bot"
          git config user.email "reviews-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Refresh Google and Tripadvisor reviews"
          git push
